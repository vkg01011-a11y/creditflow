# CreditFlow managed staging stack.
# Review resource names, region, and plan before syncing in Render.
services:
  - type: web
    name: creditflow-staging-web
    branch: feature/reliability-webhook-queue
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    preDeployCommand: npm run setup
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SHOPIFY_APP_URL
        value: https://creditflow-staging-web.onrender.com
      - key: SCOPES
        value: read_orders,read_customers,read_products,read_store_credit_accounts,read_store_credit_account_transactions,write_store_credit_account_transactions
      - key: DATABASE_URL
        fromDatabase:
          name: creditflow-staging-db
          property: connectionString
      # Prisma migrate deploy does not use the shadow database. This variable
      # is present for schema tooling; never run prisma migrate dev on staging.
      - key: SHADOW_DATABASE_URL
        fromDatabase:
          name: creditflow-staging-db
          property: connectionString
      - key: CREDITFLOW_WORKER_SECRET
        generateValue: true
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CREDITFLOW_EMAIL_FROM
        sync: false

  - type: cron
    name: creditflow-staging-worker
    branch: feature/reliability-webhook-queue
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run worker:once
    schedule: "*/1 * * * *"
    envVars:
      - key: WORKER_APP_URL
        value: https://creditflow-staging-web.onrender.com
      - key: WORKER_BATCH_LIMIT
        value: "5"
      - key: CREDITFLOW_WORKER_SECRET
        fromService:
          type: web
          name: creditflow-staging-web
          envVarKey: CREDITFLOW_WORKER_SECRET

databases:
  - name: creditflow-staging-db
    databaseName: creditflow_staging
    user: creditflow_app
    region: singapore
    plan: basic-256mb
    diskSizeGB: 15
    ipAllowList: []
