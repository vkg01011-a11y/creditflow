name: CreditFlow validation

on:
  push:
    branches:
      - feature/reliability-webhook-queue
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: creditflow-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schema, tests, types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creditflow_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creditflow_shadow?schema=public
      SHOPIFY_API_KEY: creditflow-ci-placeholder
      SHOPIFY_API_SECRET: creditflow-ci-placeholder
      SHOPIFY_APP_URL: https://example.com
      SCOPES: read_orders,read_customers,read_products,write_store_credit_account_transactions

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run automated tests
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
